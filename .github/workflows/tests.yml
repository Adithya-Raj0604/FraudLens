name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate lightweight model fixture
        # models/*.json + Dataset/features.parquet are gitignored (470MB source
        # dataset) — this fits a small model on synthetic data so /predict,
        # /explain, /health work without the real training pipeline.
        run: python scripts/generate_ci_model.py

      - name: Run API tests
        run: pytest tests/test_api.py tests/test_api_contract.py -v

  ui-tests:
    name: UI tests (Selenium + pytest)
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Generate lightweight model fixture
        run: python scripts/generate_ci_model.py

      - name: Start backend (uvicorn)
        env:
          # Defaults to http://localhost:3000 (main.py) which isn't the origin
          # the UI tests actually run against — CORS then silently blocks every
          # fetch from the browser, so the API status indicator never goes online.
          FRONTEND_ORIGIN: http://127.0.0.1:4173
        run: |
          nohup uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          npx wait-on http-get://127.0.0.1:8000/health --timeout 60000

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build + preview frontend
        working-directory: frontend
        env:
          # .env.production sets VITE_API_BASE="" (same-origin, for the real
          # CloudFront deploy) — dotenv won't override an already-set env var,
          # so this wins and points the built app at the local uvicorn backend.
          VITE_API_BASE: http://127.0.0.1:8000
        run: |
          npm run build
          nohup npm run preview -- --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173 --timeout 60000

      - uses: browser-actions/setup-chrome@v1

      - name: Run UI tests
        env:
          UI_BASE_URL: http://127.0.0.1:4173
          HEADLESS: "true"
          # ANTHROPIC_API_KEY intentionally not set here — the live-agent test
          # self-skips without it. Add it as a repo secret to opt in.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/e2e -v

  deploy:
    name: Build image → push ECR → deploy Lambda
    runs-on: ubuntu-latest
    needs: ui-tests
    # Only deploy on a push to main that passed both test jobs — never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required for OIDC: lets the job mint a token AWS trusts
      contents: read
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: fraudlens-api
      LAMBDA_FUNCTION: fraudlens-api
      # Lambda CPU scales with memory (~1 vCPU per 1769 MB), so more memory =
      # shorter cold starts. NOTE: this account is capped at 3008 MB max function
      # memory (legacy account-level limit; needs an AWS Support case to raise —
      # NOT in self-serve Service Quotas). Bump this to 5120 once that cap is
      # lifted. Plain Lambda stays pay-per-invocation — no idle charge. Keep in
      # sync with deploy/deploy.ps1.
      LAMBDA_MEMORY: 3008
      LAMBDA_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The image bakes torch + sentence-transformers + FAISS (~4.4GB). The
        # default runner disk is tight for that plus build layers, so drop the
        # preinstalled toolchains we don't use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download production model artifacts from S3
        # models/*.json + threshold_realistic.txt are gitignored (trained
        # offline). MODEL_S3_PREFIX points at the folder holding them, e.g.
        # s3://my-bucket/fraudlens/models — CI pulls them so the Dockerfile's
        # `COPY models ./models` bakes the REAL model, not an empty dir.
        run: |
          aws s3 cp "${{ vars.MODEL_S3_PREFIX }}/xgboost_fraud_realistic.json" models/xgboost_fraud_realistic.json
          aws s3 cp "${{ vars.MODEL_S3_PREFIX }}/threshold_realistic.txt"       models/threshold_realistic.txt
          ls -la models/

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_SHA="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          IMAGE_LATEST="$REGISTRY/$ECR_REPOSITORY:latest"
          # Lambda rejects BuildKit's multi-manifest/attestation images, so build
          # single-platform with provenance/sbom off (matches deploy/deploy.ps1).
          docker build --provenance=false --sbom=false --platform linux/amd64 \
            -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy image to Lambda
        # Point the function at the immutable SHA-tagged image (not :latest) so
        # each deploy is traceable to a commit, then wait for it to go live.
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_SHA" \
            --region "$AWS_REGION" >/dev/null
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" --region "$AWS_REGION"

          # Reconcile memory/timeout. update-function-code alone never changes
          # memory, so without this the function stays at its old size. The two
          # update calls can't overlap — hence the wait above and below.
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --memory-size "$LAMBDA_MEMORY" \
            --timeout "$LAMBDA_TIMEOUT" \
            --region "$AWS_REGION" >/dev/null
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" --region "$AWS_REGION"
          echo "Deployed $IMAGE_SHA to Lambda $LAMBDA_FUNCTION (${LAMBDA_MEMORY}MB)"
